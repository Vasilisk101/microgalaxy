/310;}\nfunction distance(a,b) { const p=Math.PI/180;return Math.acos(clamp(Math.sin(a.lat*p)*Math.sin(b.lat*p)+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.cos((a.lon-b.lon)*p),-1,1)); }\nfunction event(w,type,title,detail,entityId=null,causes=[],important=false) {if(w.events.length>=LIMITS.events) throw new Error('Архив событий заполнен. Экспортируйте мир; новые события не отброшены.');const e={id:`e${w.nextEvent++}`,year:w.year,type,title,detail,entityId,causes:clone(causes),important};w.events.push(e);return e;}\nconst why = (label,value) => ({label,value:typeof value==='number'?metric(value):String(value)});\nfunction leader(w,s,index=0) {return {name:name(w.seed,`${s.id}:leader:${index}`),index,age:32+Math.floor(rr(w,s.id,index,'age')*19),skill:.3+rr(w,s.id,index,'skill')*.7};}\nfunction society(w,id,idx,pop,tech) {let s={id,name:name(w.seed,id),color:COLORS[idx],population:pop,food:pop*1.7,minerals:40,tech:tech.slice(),stability:.62+rr(w,id,'stability')*.25,government:GOVERNMENTS[Math.floor(rr(w,id,'government')*3)],leader:null,language:name(w.seed,id+'lang'),divergence:0,parentId:null,foundingYear:0,unrestYears:0,lastReform:-40,supply:1,production:0,capacity:0,satellite:false,probed:[],lastLaunch:-50};s.leader=leader(w,s);return s;}\nfunction createWorld(seed='MICROGALAXY', options={}) {\n  if(typeof seed!=='string'||!seed.trim()||seed.length>128) throw new Error('Код мира должен содержать 1–128 символов.');\n  const era=options.era??'agriculture';if(!['agriculture','industrial','space'].includes(era))throw new Error('Неизвестная начальная эпоха.');\n  const count=4+Math.floor(rand(seed,'societies')*3),mass=.75+rand(seed,'mass')*.5,luminosity=mass**3.5;\n  const w={schema:SCHEMA,modelVersion:MODEL_VERSION,id:'w-'+hash(seed+era).toString(16),seed,era,name:name(seed,'star')+' · '+String(hash(seed)%1000).padStart(3,'0'),year:0,nextEvent:1,nextEntity:100,star:{mass,luminosity,temperature:4800+mass*900,age:2+rand(seed,'age')*4},planets:[],regions:[],societies:[],relations:[],wars:[],missions:[],colonies:[],events:[],history:[],snapshots:[],climate:{warming:0,pollution:0},ledger:{births:0,deaths:0,totalBefore:0,totalAfter:0},archivalCoverage:'0 + последние 63 контрольные точки; показатели — каждые 10 лет'};\n  const np=5+Math.floor(rand(seed,'nplanets')*4);\n  for(let i=0;i\u003cnp;i++){const a=Math.sqrt(luminosity)*(.35*1.69**i),kind=i===2?'terrestrial':i>4?'gas':rand(seed,i,'type')>.5?'rock':'ice';w.planets.push({id:'p'+i,name:name(seed,'p'+i),a:i===2?Math.sqrt(luminosity):a,radius:i===2?1:i>4?3+rand(seed,i,'radius')*5:.4+rand(seed,i,'radius')*.9,kind,home:i===2,temperature:i===2?12+rand(seed,'homeTemp')*9:Math.round(278*(luminosity/a**2)**.25-273),phase:rand(seed,i,'phase')*Math.PI*2,period:Math.sqrt(a**3/mass),moons:Math.floor(rand(seed,i,'moons')*(i>4?8:3))});}\n  w.planets[2].period=Math.sqrt(w.planets[2].a**3/mass);\n  // Land cells share the same terrain function as the globe, rather than imaginary overlay locations.\n  for(let i=0;i\u003c500&&w.regions.length\u003c60;i++){const lat=(rand(seed,'region',i,'lat')-.5)*135,lon=rand(seed,'region',i,'lon')*360-180;if(terrain(seed,lon,lat)\u003c0.02)continue;if(w.regions.some(r=>distance(r,{lat,lon})\u003c.1))continue;w.regions.push({id:'r'+w.regions.length,lat,lon,owner:null,fertility:.45+rand(seed,i,'fertility')*.5,water:.45+rand(seed,i,'water')*.5,biomass:.7+rand(seed,i,'bio')*.3,reserves:1500+rand(seed,i,'reserve')*5000,stress:0,disasterUntil:0});}\n  const centers=[w.regions[0]];for(let n=1;n\u003ccount;n++){const c=w.regions.reduce((best,r)=>Math.min(...centers.map(c=>distance(c,r)))>Math.min(...centers.map(c=>distance(c,best)))?r:best,w.regions[0]);centers.push(c);}\n  w.regions.forEach(r=>{let ci=0;for(let i=1;i\u003ccount;i++)if(distance(r,centers[i])\u003cdistance(r,centers[ci]))ci=i;r.owner='s'+ci;});\n  const levels={agriculture:[.4,.2,.15,.3],industrial:[1.6,1.5,1.3,1.1],space:[2.6,3.7,3.3,2.2]}[era];\n  for(let i=0;i\u003ccount;i++){const land=w.regions.filter(r=>r.owner==='s'+i);const pop=Math.round(sum(land,r=>4500*r.fertility)*(.62+rand(seed,i,'pop')*.2));const s=society(w,'s'+i,i,pop,levels.map((x,j)=>x+rand(seed,i,j,'tech')*.12));s.capitalId=centers[i].id;s.capacity=sum(land,r=>4500*r.fertility);w.societies.push(s);}\n  for(let i=0;i\u003ccount;i++)for(let j=i+1;j\u003ccount;j++)w.relations.push({a:'s'+i,b:'s'+j,trust:.3+rand(seed,i,j,'trust')*.55,trade:0});\n  event(w,'origin','Начало наблюдения',`Сформировавшаяся система и ${count} обществ. Исходное состояние задано генератором, а не вычислено из происхождения жизни.`,null,[why('Код',seed),why('Эпоха',era)],true);\n  w.ledger.totalBefore=w.ledger.totalAfter=totalPopulation(w);checkpoint(w);validateWorld(w);return w;\n}\nfunction totalPopulation(w) {return sum(w.societies,s=>s.population)+sum(w.colonies,c=>c.population)+sum(w.missions,m=>m.status==='transit'?m.people:0);}\nfunction epoch(s){const t=(s.tech[0]+s.tech[1]+s.tech[2])/3;return t\u003c1?'Ранние общества':t\u003c1.8?'Городские цивилизации':t\u003c2.6?'Промышленная эпоха':s.satellite?'Космическая эпоха':'Технологическая эпоха';}\nfunction summary(w){return {year:w.year,population:totalPopulation(w),societies:w.societies.filter(s=>s.population>0).length,colonies:w.colonies.filter(c=>c.population>0).length,warming:metric(w.climate.warming),wars:w.wars.filter(c=>c.active).length,knowledge:metric(sum(w.societies,s=>s.tech[2])/w.societies.length)};}\nfunction snapshot(w){return clone({year:w.year,climate:w.climate,regions:w.regions,societies:w.societies,colonies:w.colonies,missions:w.missions,wars:w.wars,relations:w.relations});}\nfunction checkpoint(w){w.snapshots.push(snapshot(w));if(w.snapshots.length>LIMITS.snapshots)w.snapshots.splice(1,1);if(w.year%10===0||w.year===0)w.history.push(summary(w));}\nfunction viewSnapshot(w,index){const s=w.snapshots[index];if(!s)throw new Error('Нет такой контрольной точки.');return {...clone(w),...clone(s),events:w.events.filter(e=>e.year\u003c=s.year),history:w.history.filter(h=>h.year\u003c=s.year)};}\nfunction tick(w) {\n  if(w.year>=LIMITS.years)throw new Error('Достигнут предел этой модели — 10 000 лет.');\n  w.year++;const before=totalPopulation(w);w.ledger={births:0,deaths:0,totalBefore:before,totalAfter:before};\n  const ss=[...w.societies].sort((a,b)=>a.id.localeCompare(b.id));\n  w.climate.pollution=clamp(w.climate.pollution*.996+sum(ss,s=>s.population*Math.max(0,s.tech[1]-1.2))*1e-8,0,12);\n  w.climate.warming+=(w.climate.pollution*.7-w.climate.warming)*.008;\n  for(const r of w.regions){const s=ss.find(s=>s.id===r.owner),landCount=w.regions.filter(x=>x.owner===r.owner).length,pressure=(s?.population??0)/Math.max(1,landCount)/30000;const seasonal=.09*Math.sin(w.year*.13+r.lat);r.water=clamp(r.water+(.65-.002*Math.abs(r.lat)-.016*w.climate.warming-r.water)*.03+seasonal*.07,.08,.98);r.biomass=clamp(r.biomass+r.biomass*(1-r.biomass)*.06-pressure*.006-.002*w.climate.warming,.08,1);r.stress=clamp((.5-r.water)*1.3+(.5-r.biomass),0,1);\n    if(ryear(w,r.id,'disaster')\u003c.0008&&w.year>r.disasterUntil){r.disasterUntil=w.year+3+Math.floor(ryear(w,r.id,'duration')*5);event(w,'climate','Региональная засуха',`Урожайность региона ${r.id} снижена до ${r.disasterUntil} года.`,r.owner,[why('Водообеспеченность',r.water),why('Длительность',r.disasterUntil-w.year)],false);}\n  }\n  // Economy uses an explicit food stock and bounded ore reserves. Numerical units are abstract.\n  for(const s of ss){const land=w.regions.filter(r=>r.owner===s.id),pop=s.population;if(!pop)continue;s.capacity=sum(land,r=>5500*r.fertility*r.biomass*(.6+r.water)*(.7+.65*s.tech[0])*(w.year\u003c=r.disasterUntil?.48:1));s.production=Math.max(0,Math.min(s.capacity,pop*(1.08+.18*s.tech[0])));s.food=Math.min(pop*6,s.food*.94+s.production);\n    let work=pop*.00035*(.3+s.tech[1]);for(const r of land){const mined=Math.min(r.reserves,work/Math.max(1,land.length));r.reserves-=mined;s.minerals+=mined;}s.minerals=Math.min(s.minerals,1e7);\n  }\n  // Trade transfers are real quant ly*(.65+.35*s.leader.skill)*(cost>0?1:.4)/(1+s.tech[i]*.12);s.tech[i]=Math.min(6,s.tech[i]+inc*(i===2?1.08:1));if(Math.floor(s.tech[i])>old)event(w,'science','Новая технологическая ступень',`${s.name}: ${TECH_NAMES[i].toLowerCase()} — ступень ${Math.floor(s.tech[i])}.`,s.id,[why('Обеспеченность',s.supply),why('Устойчивость',s.stability),why('Доступные материалы',s.minerals)],true);}\n    s.leader.age++;if(s.leader.age>=88||(s.leader.age>64&&ryear(w,s.id,'succession')\u003c.04)){const old=s.leader.name;s.leader=leader(w,s,s.leader.index+1);event(w,'politics','Смена руководства',`${s.name}: ${old} уступил место ${s.leader.name}.`,s.id,[why('Порядок',s.government),why('Устойчивость',s.stability)],false);}\n    if(s.stability\u003c.32&&w.year-s.lastReform>30){const prior=s.government;s.government=GOVERNMENTS[(GOVERNMENTS.indexOf(prior)+1)%GOVERNMENTS.length];s.lastReform=w.year;s.stability=clamp(s.stability+.12,.03,.97);event(w,'politics','Перестройка институтов',`${s.name}: ${prior} → ${s.government}.`,s.id,[why('Прежняя устойчивость',oldStable),why('Обеспеченность пищей',s.supply)],true);}\n    s.divergence+=.00015*(1-s.stability*.5);\n  }\n  // Migration is computed in a stable order and conserves the planetary population.\n  for(const s of ss){if(s.supply>.87||s.population\u003c500)continue;const neighbors=w.relations.filter(r=>r.trust>.3&&[r.a,r.b].includes(s.id)).map(r=>ss.find(t=>t.id===(r.a===s.id?r.b:r.a))).filter(t=>t&&t.supply>.95&&t.capacity>t.population*1.05).sort((a,b)=>a.id.localeCompare(b.id));if(!neighbors.length)continue;const to=neighbors[0],n=Math.min(Math.floor(s.population*.008),Math.floor((to.capacity-to.population)*.05));if(n>0){s.population-=n;to.population+=n;if(w.year%10===0)event(w,'migration','Переселение',`${n} жителей: ${s.name} → ${to.name}.`,s.id,[why('Нехватка пищи',1-s.supply),why('Свободная ёмкость принимающего общества',to.capacity-to.population)],false);}}\n  for(const rel of w.relations){const a=ss.find(s=>s.id===rel.a),b=ss.find(s function randomSeed(){const a=new Uint32Array(2);crypto.getRandomValues(a);return 'MG-'+a[0].toString(36).toUpperCase()+'-'+a[1].toString(36).toUpperCase();}
function uniqueId(){
  if(typeof crypto.randomUUID==='function')return 'local-'+crypto.randomUUID();
  const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;
  const hex=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');
  return 'local-'+hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);
}
function selectRecord(record){

async function transition(action){
  if(busy||switching)throw new Error('Дождитесь завершения текущего шага.');
  switching=true;setRunning(false);updateControls();
  const oldId=world?.id, wasDirty=localUnsaved, conflicted=localConflict, oldTail=saveTail;
  try{const result=await action();if(oldId&&oldId!==world?.id&&!conflicted&&store?.releaseWorld&&(!wasDirty||saveTail!==oldTail)){try{await saveTail;const sync=cloudTask?await cloudTask:true;const metadata=await store.getMetadata(oldId);const cloudClean=!!metadata?.cloud?.revision&&metadata.cloud.syncedRevision===metadata.revision&&!Storage.isCloudDirty(metadata);await store.releaseWorld(oldId);if(sync!==false&&cloudClean&&!cloudTask)try{await RetentionClient.releaseCloudWorld("v03",oldId);}catch{}}catch{/* Uncertain final save keeps the old world protected. */}}return result;}finally{switching=false;updateControls();}
}
async function installWorld(w,{skipCurrent=false}={}){
  Core.validateWorld(w);if(!skipCurrent&&world)await persist();

  selectRecord({world:next,revision:savedRevision,cloud:null});scheduleSync();
}
async function openLocal(id){
  if(world)await persist();

  if(remote&&record.cloud?.revision&&remote.revision>record.cloud.revision&&!Storage.isCloudDirty(record)){
    try{const saved=await cloudClient.get(id);record=await store.receiveCloud(saved.world,saved.revision,saved.updatedAt,record.revision);cloudState='ready';}
    catch(error){cloudState='error';cloudIssue=error.message;}
  }

async function openCloud(id){

    return;
  }

  }

let archiveRequest=0;
function renderArchive(locals){
  const merged=new Map(cloudRows);
  for(const row of locals)merged.set(row.id,{...row,local:true,remote:cloudRows.get(row.id)});
  const rows=[...merged.values()].sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))||b.year-a.year);
  let html='<p class="form-hint">Миры модели 0.3. '+(store.persistent?'Локальная запись работает на этом устройстве.':'Постоянное хранилище недоступно: используйте облако и экспорт.')+' '+(cloudState==='error'?'Облако сейчас недоступно; показаны имеющиеся копии.':'Облачные копии доступны после входа с других устройств.')+'</p><p><a class="text-link" href="/classic" data-classic-link>Открыть миры прежней модели 0.1–0.2</a></p>';
  for(const row of rows){
    const different=!!(!row.metadataPending&&row.local&&row.remote&&(Storage.isCloudDirty(row)||row.remote.revision!==(row.cloud?.revision??0)));
    const label=row.metadataPending?'Метаданные ещё не проверены':row.local?(Storage.isCloudDirty(row)?'На устройстве · есть несинхронизированные шаги':'На устройстве и в облаке'):'В облаке';
    html+='<div class="world-row"><div>'+h(row.name)+'<small>'+(row.metadataPending?'':h(row.seed)+' · год '+row.year)+'</small><small>'+label+(different?' · облачная ревизия '+row.remote.revision:'')+'</small></div><div class="world-actions"><button class="primary" '+(row.local?'data-load-world':'data-load-cloud')+'="'+h(row.id)+'">Открыть</button>'+(different?'<button data-load-cloud="'+h(row.id)+'">Облачная версия</button>':'')+'</div></div>';
  }
  if(!rows.length)html+='<p>Пока нет сохранений.</p>';
  html+='<div class="dialog-actions">'+(cloudCursor?'<button id="more-worlds">Ещё облачные миры</button>':'')+'<button id="restore-previous">Предыдущая копия текущего мира</button></div>';
  $('#dialog-body').innerHTML=html;
}
async function worldDialog(more=false){
  if(world&&!localConflict)await persist();
  const request=++archiveRequest;
  if(!more){cloudRows.clear();cloudCursor=null;}
  const locals=await store.list();
  modal('Мои миры','<p class="loading">Проверяю сохранения…</p>');
  renderArchive(locals);
  if(store.indexLegacy&&locals.some(row=>row.metadataPending))setTimeout(()=>{void (async()=>{try{await store.indexLegacy(2);if(request===archiveRequest&&$('#dialog').open&&$('#dialog-title').textContent==='Мои миры')renderArchive(await store.list());}catch{/* Unindexed entries remain visible and unchanged. */}})();},0);
  try{
    const page=await cloudClient.list(more?cloudCursor:null);
    for(const row of page.worlds)cloudRows.set(row.id,row);
    cloudCursor=page.nextCursor;cloudState='ready';cloudIssue='';
  }catch(error){cloudState='error';cloudIssue=error.message;}
  if(request===archiveRequest&&$('#dialog').open&&$('#dialog-title').textContent==='Мои миры')renderArchive(await store.list());
  showSaveStatus();
}
function about(){modal('MICROGALAXY · 0.3','<p>Личная обсерватория одной звёздной системы. Самостоятельная история обществ, региональной среды, миграций, конфликтов и космических миссий. Вы — наблюдатель; управлять обществами нельзя.</p><p>Новые системы рассчитываются моделью 0.3. Старые миры 0.1–0.2 продолжаются по прежним правилам в <a class="text-link" href="/classic" data-classic-link>режиме совместимости</a> — без изменения исходных сохранений.</p><p>Миры сохраняются на устройстве и в личном облачном архиве, когда он доступен. Статус наверху показывает фактический результат; «Сохранить» проверяет синхронизацию. Для резервной копии используйте экспорт.</p><p>Генеративного ИИ и телеметрии нет. Глобус и орбиты рисуются программно; расчётный горизонт — 10 000 лет. Единицы производства и исследовательские уровни игровые: это не научный прогноз.</p><p class="form-hint">Экспорт кандидата 0.3 совместим с этой моделью. Файлы прежней модели импортируются в режиме 0.2; автоматического пересчёта старой истории нет.</p>');}

  }catch(error){notice(error.message,error.name==='ConflictError');}finally{e.target.value='';}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){setRunning(false);if(world&&!busy)void persist().then(()=>syncCurrent(false)).catch(()=>{});}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['INPUT','SELECT','TEXTAREA','BUTTON','A'].includes(document.activeElement.tagName)&&!$('#dialog').open){e.preventDefault();setRunning(!running);}});
window.addEventListener('beforeunload',e=>{if(busy||localUnsaved||(!store?.persistent&&world&&(!currentRecord||Storage.isCloudDirty(currentRecord)))){e.preventDefault();e.returnValue='';}});
async function refreshBootCloud(initial){
  try{
    const page=await cloudClient.list();for(const row of page.worlds)cloudRows.set(row.id,row);cloudCursor=page.nextCursor;cloudState='ready';cloudIssue='';
    if(initial?.cloud?.revision){
      const remote=await cloudClient.get(initial.world.id);
      if(remote.revision>initial.cloud.revision){
        const local=await store.get(initial.world.id);
        if(world?.id===initial.world.id&&!busy&&!running&&!switching&&!$('#dialog').open&&revision===initial.revision&&!Storage.isCloudDirty(local)){
          await transition(async()=>{const row=await store.receiveCloud(remote.world,remote.revision,remote.updatedAt,local.revision);selectRecord(row);notice('Загружена более новая облачная история.');});
        }else notice('В облаке есть другая версия. Откройте «Мои миры», чтобы выбрать историю.');
      }
    }
  }catch(error){cloudState='error';cloudIssue=error.message;}
  showSaveStatus();
}
async function boot(){
  switching=true;updateControls();sound=(pref('microgalaxy:v03:sound')??pref('microgalaxy:sound'))!=='off';updateSound();initWorker();
  let storageIssue='';
  try{store=await Storage.openWorldStore();}catch(error){store=Storage.memoryWorldStore();storageIssue=error.message||'Браузер запретил постоянное хранилище.';}
  cloudSync=Cloud.createCloudSync(store,cloudClient);
  const query=new URLSearchParams(window.location.search),requestedId=query.get('world'),requestedSource=query.get('source')??'auto';
  if(query.has('world')){
    if(!/^(?:local-)?[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(requestedId)||!['auto','cloud','local'].includes(requestedSource))throw new Error('Неверная ссылка на сохранённый мир. Вернитесь в общий каталог.');
    const local=requestedSource==='cloud'?undefined:await store.get(requestedId);
    if(requestedSource==='local'||(requestedSource==='auto'&&local)){
      if(!local)throw new Error('Запрошенного мира нет на этом устройстве. Откройте облачную запись из общего каталога.');
      if(local.world.id!==requestedId)throw new Error('Идентификатор местной истории не совпадает со ссылкой. Запись не изменена.');
      selectRecord(local);
    }else await openCloud(requestedId);
    switching=false;updateControls();
  }else{
  let initial;
  try{const last=pref('microgalaxy_local_candidate_last'),locals=await store.list(),id=locals.find(r=>r.id===last)?.id??locals[0]?.id;if(id)initial=await store.get(id);}catch(error){notice('Не удалось прочитать локальный мир: '+error.message);}
  if(initial){selectRecord(initial);switching=false;updateControls();void refreshBootCloud(initial);}
  else{
    try{const page=await cloudClient.list();for(const row of page.worlds)cloudRows.set(row.id,row);cloudCursor=page.nextCursor;cloudState='ready';if(page.worlds.length){const remote=await cloudClient.get(page.worlds[0].id);selectRecord(await store.receiveCloud(remote.world,remote.revision,remote.updatedAt,0));}}
    catch(error){cloudState='error';cloudIssue=error.message;}
    if(!world)await installWorld(Core.createWorld(randomSeed()),{skipCurrent:true});
    switching=false;updateControls();
  }
  }
  showSaveStatus();render();
  if(storageIssue)notice('Постоянное хранилище недоступно: '+storageIssue+' Миры остаются в памяти; используйте облако или экспорт.');
  setInterval(()=>{if(running&&!busy&&!switching&&!document.hidden&&!$('#dialog').open)void step(speed,autoPause);},450);
  setInterval(()=>{if(world&&!document.hidden&&!localConflict)void syncCurrent(false);},18000);
  if(currentRecord&&Storage.isCloudDirty(currentRecord))scheduleSync();
}
boot().catch(error=>{switching=false;setRunning(false);notice('Не удалось открыть обсерваторию: '+error.message);updateControls();});


})();</script></body></html>

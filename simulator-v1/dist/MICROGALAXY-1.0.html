/* 0.4: the same observatory, with readable political dossiers and linked history. */
a:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button,select,input,a{ -webkit-tap-highlight-color:transparent }

.history-filters label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:10px;min-width:0}

dialog{overscroll-behavior:contain}

<script id="worker-source" type="application/json">"const Geography=(()=>{\n/** Deterministic, deliberately aggregate geography for MICROGALAXY 0.5.\n * Region markers represent areas, not surveyed points. Distances assume an\n * Earth-sized sphere; route costs are model travel days, not predictions.\n * This module has no dependency on Core, the DOM, randomness or wall time.\n */\nconst clampGeo = (n, a, b) => Math.max(a, Math.min(b, n));\nconst sumGeo = (items, fn) => items.reduce((total, item) => total + fn(item), 0);\nconst copyGeo = value => structuredClone(value);\nconst cmpGeo = (a, b) => String(a).localeCompare(String(b), 'en');\nconst EARTH_RADIUS = 6371;\nconst MAX_MOVEMENTS = 192;\nconst BIOME_NAMES = Object.freeze({highlands:'Нагорья',tundra:'Холодные равнины',forest:'Лесной край',grassland:'Плодородные равнины',drylands:'Засушливый край'});\nconst SETTLEMENT_NAMES = Object.freeze({village:'Поселение',town:'Город',city:'Крупный город'});\nconst SPECIALIZATION_NAMES = Object.freeze({agriculture:'Земледелие',mining:'Добыча сырья',port:'Портовый центр',administration:'Административный центр',crafts:'Ремёсла'});\n\nfunction hashGeo(value) {\n  let h = 2166136261;\n  for (const c of String(value)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }\n  return h >>> 0;\n}\nfunction randomGeo(seed, ...keys) {\n  let x = hashGeo(JSON.stringify([seed, ...keys]));\n  x ^= x >>> 16; x = Math.imul(x, 0x7feb352d); x ^= x >>> 15;\n  x = Math.imul(x, 0x846ca68b); x ^= x >>> 16;\n  return (x >>> 0) / 4294967296;\n}\nfunction terrainGeo(seed, lon, lat) {\n  const q = randomGeo(seed, 'terrain') * 6.28, x = lon * Math.PI / 180, y = lat * Math.PI / 180;\n  return Math.sin(x * 2 + q + Math.sin(y * 3)) * .46 + Math.cos(x * 3 - y * 2 + q) * .25 +\n    Math.sin(x * 5 + y * 4) * .13 + Math.cos(x * 11 - y * 8 + q) * .07 - Math.abs(lat) / 310;\n}\nfunction angleGeo(a, b) {\n  const p = Math.PI / 180;\n  return Math.acos(clampGeo(Math.sin(a.lat*p)*Math.sin(b.lat*p)+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.cos((a.lon-b.lon)*p), -1, 1));\n}\nfunction vecGeo(r) {\n  const p = Math.PI / 180, c = Math.cos(r.lat * p);\n  return [c * Math.cos(r.lon * p), Math.sin(r.lat * p), c * Math.sin(r.lon * p)];\n}\nfunction pointAlongGeo(a, b, t) {\n  const av = vecGeo(a), bv = vecGeo(b), theta = angleGeo(a, b), sine = Math.sin(theta);\n  const u = Math.abs(sine) \u003c 1e-7 ? 1-t : Math.sin((1-t)*theta)/sine;\n  const v = Math.abs(sine) \u003c 1e-7 ? t : Math.sin(t*theta)/sine;\n  const x = av[0]*u+bv[0]*v, y = av[1]*u+bv[1]*v, z = av[2]*u+bv[2]*v;\n  return {lon:Math.atan2(z,x)*180/Math.PI,lat:Math.atan2(y,Math.hypot(x,z))*180/Math.PI};\n}\nfunction edgeBetweenGeo(w, a, b) {\n  const radians = angleGeo(a, b), n = Math.max(3, Math.min(96, Math.ceil(radians/.035)));\n  let wet = 0, peak = Math.max(a.elevation, b.elevation);\n  for (let i=1; i\u003cn; i++) {\n    const p = pointAlongGeo(a,b,i/n), h = terrainGeo(w.seed,p.lon,p.lat);\n    if (h \u003c .02) wet++;\n    peak = Math.max(peak, clampGeo((h-.02)/1.1,0,1));\n  }\n  const kind = wet ? 'sea' : 'land', distance = Math.max(1,Math.round(radians*EARTH_RADIUS));\n  const cost = kind === 'sea' ? 8+distance/280 : distance/150*(1+peak*1.8);\n  const ids = [a.id,b.id].sort(cmpGeo);\n  return {id:'g:'+ids.join(':'),a:ids[0],b:ids[1],kind,distance,cost:Math.round(cost*1000)/1000};\n}\nfunction adjacencyGeo(w) {\n  const map = new Map(w.regions.map(r => [r.id, []]));\n  for (const edge of w.geography?.edges ?? []) {\n    if (map.has(edge.a) && map.has(edge.b)) {\n      map.get(edge.a).push({to:edge.b,edge});\n      map.get(edge.b).push({to:edge.a,edge});\n    }\n  }\n  for (const values of map.values()) values.sort((a,b)=>cmpGeo(a.to,b.to));\n  return map;\n}\nfunction connectedIdsGeo(ids, adjacency) {\n  if (!ids.length) return true;\n  const allowed = new Set(ids), visited = new Set([ids[0]]), queue = [ids[0]];\n  for (let n=0; n\u003cqueue.length; n++) for (const {to} of adjacency.get(queue[n]) ?? []) {\n    if ( }\n  if (!p) {\n    const foundation = record(w, 'foundation', upper.id, {owner: upper.owner});\n    trace(w, 'кладка опоры', upper.id, foundation);\n    witness(w, upper.id, foundation, 'начало местных работ');\n    p = basin.project = {\n      site: upper.id, founder: upper.owner, owner: upper.owner, started: w.year, completed: null,\n      required: 100 + Math.ceil(basin.drop * 70), labor: 0, yearsPaid: 0, lastWorked: w.year,\n      status: 'building', spent: {raw: 0, equipment: 0, food: 0}\n    };\n    if(revised){\n      Object.assign(p,{id:foundation.id,originalPurpose:purpose,purpose,payments:[],decisions:[]});\n      foundation.purpose=purpose;\n    }\n  }\n  if(revised&&purpose!==p.purpose){\n    record(w,'purpose',upper.id,{owner:upper.owner,previous:p.purpose,purpose,reason:purpose==='passage'?'перевозки по действующей переправе':'потребность хозяйств в воде'});\n    p.purpose=purpose;\n  }\n  const allowed = new Set([upper.id]);\n  const payment={};\n  for (const [key, amount] of Object.entries(MATERIALS)) {\n    const paid = Economy.spend(w, upper.owner, key, amount, 'construction', allowed);\n    if (Math.abs(amount - paid) > 1e-8) throw new Error('Неполная оплата годовых работ на плотине.');\n    p.spent[key] += paid;\n    if(revised)payment[key]=paid;\n  }\n  p.labor += crew;\n  p.yearsPaid++;\n  p.lastWorked = w.year;\n  if(revised){\n    p.payments.push({year:w.year,owner:upper.owner,purpose,crew,...payment});\n    const last=p.decisions.at(-1);\n    if(last?.reason!=='работы оплачены'||last.owner!==upper.owner)p.decisions.push({year:w.year,owner:upper.owner,reason:'работы оплачены'});\n    if(!p.accountRecord&&hasSkill(w,upper.owner,'records')){\n      const fact=record(w,'payment',upper.id,{owner:upper.owner,founder:p.founder,purpose,...payment,crew});\n      p.accountRecord=fact.id;trace(w,'реестр поставок',upper.id,fact);\n    }\n  }\n  p.status = 'building';\n  if (p.labor >= p.required) {\n    p.status = 'completed';\n    p.completed = w.year;\n    const fact = record(w, 'completed', upper.id, {owner: upper.owner, founder: p.founder, downstream: lower.id});\n    trace(w, 'пазы водосброса', upper.id, fact);\n    witness(w, upper.id, fact, 'окончание работ');\n    witness(w, lower.id, fact, 'окончание работ');\n  }\n}\n\nfunction salvage(w,b){\n  const p=b.project;\n  if(p?.status!=='paused'||w.year-p.lastWorked\u003c25)return;\n  const r=region(w,p.site);\n  if(r.occupation||r.population\u003c120||r.economy.stock.raw>=3||!hasSkill(w,r.owner,'workshops'))return;\n  const damaged=r.reconstruction>0||w.economy.routes.some(route=>[route.a,route.b].includes(r.id)&&route.condition\u003c.7);\n  if(!damaged)return;\n  const raw=Math.floor(p.spent.raw*.5*1000)/1000;\n  if(raw\u003c=0)return;\n  Economy.reclaimMaterial(w,r.id,raw);\n  const fact=record(w,'dismantled',r.id,{owner:r.owner,raw,project:p.id});\n  p.dismantled={year:w.year,owner:r.owner,raw,source:fact.id};p.status='dismantled';\n  for(const t of w.observatory.living.traces){\n    if(t.lost===null&&t.source===p.id&&t.kind==='кладка опоры'){\n      t.lost=w.year;record(w,'lost',r.id,{trace:t.id,reason:'разбор',cause:fact.id});\n    }\n  }\n  witness(w,r.id,fact,'сырьё разобранных опор поступило на местный склад');\n}\n\nfunction discover(w, basin) {\n  for (const t of w.observatory.living.traces) {\n    if (t.lost !== null || w.year \u003c= t.formed) continue;\n    const r = region(w, t.site);\n    const eroded = ['старый берег', 'остатки причала', 'насыпь старой дороги'].includes(t.kind)\n      && basin.silt > .6 && basin.flow > .45;\n    if (eroded) {\n      t.lost = w.year;\n      record(w, 'lost', t.site, {trace: t.id});\n      continue;\n    }\n    if (t.discovered !== null || w.year - t.formed \u003c 30 || r.population \u003c 400 || !hasSkill(w, r.owner, 'records')) continue;\n    // A working structure is visible in the present. Its archaeology opens when\n    // a changed owner, abandonment or exposed bank gives the community a reason to investigate.\n    const survey=fieldEdition(w)&&(t.kind==='реестр поставок'||r.settlement.infrastructure>=.22&&basin.flow\u003c.60);\n    const disused = survey||['старый берег', 'остатки причала', 'насыпь старой дороги'].includes(t.kind) || basin.project?.status === 'paused'\n      || basin.project?.founder !== basin.project?.owner;\n    if (!disused) continue;\n    t.discovered = w.year;\n    record(w, 'discovery', t.site, {trace: t.id});\n    remember(w, t.site, t.source, r.population * .12, 'сохранился вещественный след', 'находка', null, t.site, 2,\n      {year: w.year, trace: t.id});\n  }\n}\n\nfunction nextGeneration(carriers,population,canTeach) {\n  const retiring=Math.ceil(carriers/32);\n  const students=canTeach&&population ? Math.min(retiring,Math.floor(population*.015)) : Math.floor(retiring*.7);\n  return Math.min(population,carriers-retiring+students);\n}\n\nfunction rememberConflict(w,event){\n  const kept=new Set();\n  function local(site,opinion,kind,value,record=event){\n    const r=region(w,site);\n    if(!r?.population||kept.has(site))return;\n    kept.add(site);\n    const basis={site,kind,value,record:record.id,year:record.year};\n    remember(w,site,event.id,r.population*.18,opinion,'очевидцы',null,site,2,null,null,basis);\n  }\n  if(event.title==='Оккупация региона'){\n    for(const site of event.regionIds??[])local(site,'пережили занятие региона','occupation',region(w,site).reconstruction);\n    return;\n  }\n  if(event.title!=='Мирное соглашение')return;\n  const war=w.wars.find(c=>!c.active&&event.causeEventIds.includes(c.originEventId));\n  if(!war)return;\n  if(war.compensation?.amount>0){\n    local(war.compensation.fromRegion,'по соглашению передали сырьё','paid',war.compensation.amount);\n    local(war.compensation.toRegion,'по соглашению получили сырьё','received',war.compensation.amount);\n  }\n  for(const site of event.regionIds??[])local(site,'по соглашению изменился владелец региона','boundary',null);\n  for(const earlier of Archive.iterateEvents(w,{afterYear:war.start-1,throughYear:event.year})){\n    if(earlier.title!=='Оккупация региона'||!earlier.causeEventIds.includes(war.originEventId))continue;\n    for(const site of earlier.regionIds??[])local(site,'после занятия дождались мира','relief',null,earlier);\n  }\n}\n\nfunction advanceMemories(w) {\n  const living = w.observatory.living;\n  for (const m of living.memories) {\n    const r = region(w, m.site);\n    m.carriers=nextGeneration(m.carriers,r.population,hasSkill(w,r.owner,'records')&&r.social.access>=.35);\n  }\n  living.memories = living.memories.filter(m => m.carriers > 0);\n  for (const move of w.geography.movements) {\n    if (move.year !== w.year) continue;\n    const sourcePop = region(w, move.from).population + move.people;\n    const memories = living.memories.filter(m => m.site === move.from);\n    for (const m of memories) {\n      const travellers = Math.min(m.carriers, Math.floor(move.people * m.carriers / Math.max(1, sourcePop)));\n      if (!travellers) continue;\n      m.carriers -= travellers;\n      remember(w, move.to, m.fact, travellers, m.opinion, 'переселение', move.from, m.origin, m.weight, m.evidence,m);\n    }\n  }\n  living.memories = living.memories.filter(m => m.carriers > 0);\n  const stillInTransit = new Set(w.economy.shipments.map(s => s.id));\n  for (const delivery of dueShipments.get(w) ?? []) {\n    if (stillInTransit.has(delivery.id) || delivery.amount \u003c 30) continue;\n    const source = fieldEdition(w) ? delivery.testimony : living.memories.filter(m => m.site === delivery.from && m.received \u003c w.year)\n      .sort((a, b) => b.weight - a.weight || b.carriers - a.carriers || a.received - b.received)[0];\n    if (source) remember(w, delivery.to, source.fact, Math.min(source.carriers, Math.ceil(delivery.amount / 50)),\n      source.opinion, 'обмен', delivery.from, source.origin, source.weight, source.evidence,source);\n  }\n  dueShipments.delete(w);\n  for (const e of Archive.eventsAfter(w, living.eventCursor)) {\n    if(fieldEdition(w)&&e.type==='conflict')rememberConflict(w,e);\n    if (e.type !== 'diplomacy' || e.title !== 'Торговый договор') continue;\n    for (const id of e.entityIds) {\n      const s = w.societies.find(society => society.id === id);\n      if (s) remember(w, s.capitalId, e.id, region(w, s.capitalId).population * .12, 'договор о торговле', 'очевидцы');\n    }\n  }\n  living.eventCursor = w.nextEvent - 1;\n  // A locally used road name can persist after the last person who knew its\n  // explanation. Keep at most one established name per settlement.\n  living.roadNames ??= [];\n  for(const name of living.roadNames){\n    if(name.silent===null && !region(w,name.site).population)name.silent=w.year;\n  }\n  for(const m of living.memories){\n    if(m.via!=='переселение'||m.origin===m.site||w.year-m.received\u003c40||m.carriers\u003c8||living.roadNames.some(n=>n.site===m.site))continue;\n    const origin=region(w,m.origin);\n    living.roadNames.push({site:m.site,fact:m.fact,origin:m.origin,year:w.year,silent:null,\n      name:'Дорога «'+origin.settlement.name+'»'});\n  }\n}\n\nfunction afterYear(w) {\n  if(fieldEdition(w)){\n    const living=w.observatory.living;\n    for(const cargo of w.economy.shipments){\n      if(cargo.departure!==w.year||cargo.amount\u003c30)continue;\n      const source=living.memories.filter(m=>m.site===cargo.from&&m.received\u003c=cargo.departure)\n        .sort((a,b)=>b.weight-a.weight||b.carriers-a.carriers||a.received-b.received)[0];\n      if(source)cargo.testimony=structuredClone(source);\n    }\n  }\n  advanceMemories(w);\n  const b = w.observatory.living.basin;\n  if (b) {\n    build(w, b);\n    if(fieldEdition(w))salvage(w,b);\n    discover(w, b);\n  }\n}\n\nfunction summary(w, year = w.year) {\n  if (!Number.isSafeInteger(year) || year \u003c 0 || year > w.year) throw new Error('Недоступный год наблюдения.');\n  const living = w.observatory?.living;\n  if (!living) return {year, available: false, basin: null, facts: [], traces: [], memories: []};\n  const exact = year === w.year ? living : w.snapshots?.find(s => s.year === year)?.observatory?.living;\n  const facts = living.facts.filter(f => f.year \u003c= year);\n  const visible = living.traces.filter(t => t.formed \u003c= year && (t.lost === null || t.lost > year));\n  return structuredClone({\n    year, available: true, exact: !!exact, basin: exact?.basin ?? null,\n    roadNames:(exact?.roadNames??[]).filter(n=>n.silent===null).map(n=>{\n      const witness=exact.memories.find(m=>m.site===n.site&&m.fact===n.fact);\n      return {site:n.site,year:n.year,name:n.name,origin:witness?n.origin:null,fact:witness?n.fact:null};\n    }),\n    facts: facts.map(f => ({...f, title: FACT_NAMES[f.kind]})),\n    traces: visible.map(t => ({...t, discovered: t.discovered \u003c= year ? t.discovered : null, lost: null})),\n    memories: (exact?.memories ?? []).map(m => {\n      const source = m.fact.startsWith('river-') ? facts.find(f => f.id === m.fact) : Archive.eventById(w, m.fact, year);\n      return {...m, sourceYear: source?.year ?? null, title: FACT_NAMES[source?.kind] ?? source?.title ?? ''};\n    })\n  });\n}\n\n// Each inference uses only the selected, surviving and already identified traces.\nfunction investigate(w,claim,ids){\n  const data=summary(w),chosen=new Set(ids),facts=new Map(data.facts.map(f=>[f.id,f]));\n  const sources=data.traces.filter(t=>chosen.has(t.id)&&t.discovered!==null).map(t=>({trace:t,fact:facts.get(t.source)})).filter(x=>x.fact);\n  const questions=[\n    ['founder','Инициатор стройки','foundation','owner'],\n    ['payer','Плательщик по сохранившемуся реестру','payment','owner'],\n    ['purpose','Исходное назначение','foundation','purpose'],\n    ['finisher','Владелец при завершении','completed','owner']\n  ];\n  return questions.map(([key,title,kind,field])=>{\n    const evidence=sources.filter(s=>s.fact.kind===kind&&s.fact[field]!=null);\n    const status=!claim[key]||!evidence.length?'unknown':evidence.some(s=>s.fact[field]!==claim[key])?'contradicted':'confirmed';\n    return {key,title,status,sources:evidence.map(s=>({trace:s.trace.id,kind:s.trace.kind,record:s.fact.id,year:s.fact.year,value:s.fact[field]}))};\n  });\n}\n\nfunction validate(w) {\n  const fail = message => { throw new Error('Некорректная история места: ' + message); };\n  const living = w.observatory?.living;\n  const count = (n, max) => Number.isSafeInteger(n) && n >= 0 && n \u003c= max;\n  const unit = n => Number.isFinite(n) && n >= 0 && n \u003c= 1;\n  const sites = new Set(w.regions.map(r => r.id));\n  const societies = new Set(w.societies.map(s => s.id));\n  // Other edition hooks may append an event after this year's memory pass\n  // (including the origin event immediately following initialization).\n  if (!living || living.version !== 1 || !count(living.eventCursor, w.nextEvent - 1)\n    || Archive.eventsAfter(w, living.eventCursor).some(e => e.year !== w.year)) fail('версия или курсор');\n  if (!Array.isArray(living.facts) || living.facts.length > w.year * (fieldEdition(w)?9:6) || !Array.isArray(living.traces)\n    || living.traces.length > (fieldEdition(w)?5:4) || !Array.isArray(living.memories) || living.memories.length > sites.size * MEMORY_SLOTS) fail('размеры истории');\n  const facts = new Map(), traces = new Map();\n  let lastYear = 0;\n  for (const [i, fact] of living.facts.entries()) {\n    if (!fact || fact.id !== 'river-' + (i + 1) || !Object.hasOwn(FACT_NAMES, fact.kind) || !fieldEdition(w)&&['purpose','payment','dismantled'].includes(fact.kind) || !sites.has(fact.site)\n      || !count(fact.year, w.year) || fact.year \u003c lastYear || fact.year === 0) fail('запись');\n    for (const key of ['owner', 'founder', 'previousOwner']) if (key in fact && !societies.has(fact[key])) fail('общество записи');\n    for (const key of ['downstream', 'newOutlet']) if (key in fact && !sites.has(fact[key])) fail('место записи');\n    facts.set(fact.id, fact);\n    lastYear = fact.y function chooseBasin(w) {

// Heights, channel depth and flow are relative model units. The old crossing lies

    .map(e=>e.a===site ? e.b : e.a);

}

function salvage(w,b){
  const p=b.project;
  if(p?.status!=='paused'||w.year-p.lastWorked<25)return;
  const r=region(w,p.site);
  if(r.occupation||r.population<120||r.economy.stock.raw>=3||!hasSkill(w,r.owner,'workshops'))return;
  const damaged=r.reconstruction>0||w.economy.routes.some(route=>[route.a,route.b].includes(r.id)&&route.condition<.7);
  if(!damaged)return;
  const raw=Math.floor(p.spent.raw*.5*1000)/1000;
  if(raw<=0)return;
  Economy.reclaimMaterial(w,r.id,raw);
  const fact=record(w,'dismantled',r.id,{owner:r.owner,raw,project:p.id});
  p.dismantled={year:w.year,owner:r.owner,raw,source:fact.id};p.status='dismantled';

    if(t.lost===null&&t.source===p.id&&t.kind==='кладка опоры'){

function discover(w, basin) {
  for (const t of w.observatory.living.traces) {
    if (t.lost !== null || w.year <= t.formed) continue;
    const r = region(w, t.site);
    const eroded = ['старый берег', 'остатки причала', 'насыпь старой дороги'].includes(t.kind)
      && basin.silt > .6 && basin.flow > .45;
    if (eroded) {
      t.lost = w.year;
      record(w, 'lost', t.site, {trace: t.id});
      continue;
    }
    if (t.discovered !== null || w.year - t.formed < 30 || r.population < 400 || !hasSkill(w, r.owner, 'records')) continue;
    // A working structure is visible in the present. Its archaeology opens when
    // a changed owner, abandonment or exposed bank gives the community a reason to investigate.
    const survey=fieldEdition(w)&&(t.kind==='реестр поставок'||r.settlement.infrastructure>=.22&&basin.flow<.60);
    const disused = survey||['старый берег', 'остатки причала', 'насыпь старой дороги'].includes(t.kind) || basin.project?.status === 'paused'
      || basin.project?.founder !== basin.project?.owner;
    if (!disused) continue;
    t.discovered = w.year;
    record(w, 'discovery', t.site, {trace: t.id});

  const students=canTeach&&population ? Math.min(retiring,Math.floor(population*.015)) : Math.floor(retiring*.7);

  }
  if(event.title!=='Мирное соглашение')return;

    if(earlier.title!=='Оккупация региона'||!earlier.causeEventIds.includes(war.originEventId))continue;

function advanceMemories(w) {
  const living = w.observatory.living;
  for (const m of living.memories) {
    const r = region(w, m.site);
    m.carriers=nextGeneration(m.carriers,r.population,hasSkill(w,r.owner,'records')&&r.social.access>=.35);
  }
  living.memories = living.memories.filter(m => m.carriers > 0);
  for (const move of w.geography.movements) {
    if (move.year !== w.year) continue;
    const sourcePop = region(w, move.from).population + move.people;
    const memories = living.memories.filter(m => m.site === move.from);
    for (const m of memories) {
      const travellers = Math.min(m.carriers, Math.floor(move.people * m.carriers / Math.max(1, sourcePop)));
      if (!travellers) continue;
      m.carriers -= travellers;
      remember(w, move.to, m.fact, travellers, m.opinion, 'переселение', move.from, m.origin, m.weight, m.evidence,m);
    }
  }
  living.memories = living.memories.filter(m => m.carriers > 0);
  const stillInTransit = new Set(w.economy.shipments.map(s => s.id));
  for (const delivery of dueShipments.get(w) ?? []) {
    if (stillInTransit.has(delivery.id) || delivery.amount < 30) continue;
    const source = fieldEdition(w) ? delivery.testimony : living.memories.filter(m => m.site === delivery.from && m.received < w.year)
      .sort((a, b) => b.weight - a.weight || b.carriers - a.carriers || a.received - b.received)[0];
    if (source) remember(w, delivery.to, source.fact, Math.min(source.carriers, Math.ceil(delivery.amount / 50)),
      source.opinion, 'обмен', delivery.from, source.origin, source.weight, source.evidence,source);
  }
  dueShipments.delete(w);
  for (const e of Archive.eventsAfter(w, living.eventCursor)) {
    if(fieldEdition(w)&&e.type==='conflict')rememberConflict(w,e);
    if (e.type !== 'diplomacy' || e.title !== 'Торговый договор') continue;
    for (const id of e.entityIds) {
      const s = w.societies.find(society => society.id === id);
      if (s) remember(w, s.capitalId, e.id, region(w, s.capitalId).population * .12, 'договор о торговле', 'очевидцы');
    }
  }
  living.eventCursor = w.nextEvent - 1;
  // A locally used road name can persist after the last person who knew its
  // explanation. Keep at most one established name per settlement.
  living.roadNames ??= [];
  for(const name of living.roadNames){
    if(name.silent===null && !region(w,name.site).population)name.silent=w.year;
  }
  for(const m of living.memories){
    if(m.via!=='переселение'||m.origin===m.site||w.year-m.received<40||m.carriers<8||living.roadNames.some(n=>n.site===m.site))continue;
    const origin=region(w,m.origin);
    living.roadNames.push({site:m.site,fact:m.fact,origin:m.origin,year:w.year,silent:null,
      name:'Дорога «'+origin.settlement.name+'»'});
  }
}

function afterYear(w) {
  if(fieldEdition(w)){
    const living=w.observatory.living;
    for(const cargo of w.economy.shipments){
      if(cargo.departure!==w.year||cargo.amount<30)continue;
      const source=living.memories.filter(m=>m.site===cargo.from&&m.received<=cargo.departure)
        .sort((a,b)=>b.weight-a.weight||b.carriers-a.carriers||a.received-b.received)[0];
      if(source)cargo.testimony=structuredClone(source);
    }
  }
  advanceMemories(w);
  const b = w.observatory.living.basin;
  if (b) {
    build(w, b);
    if(fieldEdition(w))salvage(w,b);
    discover(w, b);
  }
}

function summary(w, year = w.year) {
  if (!Number.isSafeInteger(year) || year < 0 || year > w.year) throw new Error('Недоступный год наблюдения.');
  const living = w.observatory?.living;
  if (!living) return {year, available: false, basin: null, facts: [], traces: [], memories: []};
  const exact = year === w.year ? living : w.snapshots?.find(s => s.year === year)?.observatory?.living;
  const facts = living.facts.filter(f => f.year <= year);
  const visible = living.traces.filter(t => t.formed <= year && (t.lost === null || t.lost > year));
  return structuredClone({
    year, available: true, exact: !!exact, basin: exact?.basin ?? null,
    roadNames:(exact?.roadNames??[]).filter(n=>n.silent===null).map(n=>{
      const witness=exact.memories.find(m=>m.site===n.site&&m.fact===n.fact);
      return {site:n.site,year:n.year,name:n.name,origin:witness?n.origin:null,fact:witness?n.fact:null};
    }),
    facts: facts.map(f => ({...f, title: FACT_NAMES[f.kind]})),
    traces: visible.map(t => ({...t, discovered: t.discovered <= year ? t.discovered : null, lost: null})),
    memories: (exact?.memories ?? []).map(m => {
      const source = m.fact.startsWith('river-') ? facts.find(f => f.id === m.fact) : Archive.eventById(w, m.fact, year);
      return {...m, sourceYear: source?.year ?? null, title: FACT_NAMES[source?.kind] ?? source?.title ?? ''};
    })
  });
}

// Each inference uses only the selected, surviving and already identified traces.
function investigate(w,claim,ids){
  const data=summary(w),chosen=new Set(ids),facts=new Map(data.facts.map(f=>[f.id,f]));
  const sources=data.traces.filter(t=>chosen.has(t.id)&&t.discovered!==null).map(t=>({trace:t,fact:facts.get(t.source)})).filter(x=>x.fact);
  const questions=[
    ['founder','Инициатор стройки','foundation','owner'],
    ['payer','Плательщик по сохранившемуся реестру','payment','owner'],
    ['purpose','Исходное назначение','foundation','purpose'],
    ['finisher','Владелец при завершении','completed','owner']
  ];
  return questions.map(([key,title,kind,field])=>{
    const evidence=sources.filter(s=>s.fact.kind===kind&&s.fact[field]!=null);
    const status=!claim[key]||!evidence.length?'unknown':evidence.some(s=>s.fact[field]!==claim[key])?'contradicted':'confirmed';
    return {key,title,status,sources:evidence.map(s=>({trace:s.trace.id,kind:s.trace.kind,record:s.fact.id,year:s.fact.year,value:s.fact[field]}))};
  });
}

    if(m.handovers!==undefined){

const FreightObservation = (()=>{

 function balance(records){

  if (year === live.year) return true;
  const anchor = live.snapshots?.findLast(point => point.year <= year);
  if (!anchor) return false;
  if (anchor.year === year) return true;
  const fork = live.observatory?.experiment;
  return !fork || year < fork.year || anchor.observatory?.experiment?.pairId === fork.pairId;

async function perform(core, recordsFor, input, pause) {
  const { task, regionId, year } = input;
  let state;
  if (task === 'example') {
    state = core.createWorld(input.seed, {era: 'industrial'});
  } else if (task === 'year') {
    if (!canVisit(input.world, year)) throw new Error('Для этой даты в архиве нет подтверждённого состояния места.');
    if (year === input.world.year) return {world:input.world};
    const index = input.world.snapshots.findLastIndex(point => point.year <= year);
    state = core.viewSnapshot(input.world, index);
  } else if (task === 'next') {
    state = input.world;
  } else {
    throw new Error('Неизвестное действие наблюдателя.');
  }
  const session = core.createWorkerSession(state);
  if (task === 'next') {
    const until = Math.min(state.year + 30, core.LIMITS.years);
    while (state.year < until) {
      session.step(1);
      if (recordsFor(state, regionId).some(record => record.year === state.year)) {
        return {world: state, found:true};
      }
      await pause();
    }
    return {world: state, found:false};
  }
  while (state.year < year) {
    session.step(Math.min(10, year - state.year));
    await pause();
  }

}

function branchComparison(x,index=x.report.samples.length-1,mobileRole=0){
  const style='<style>.twin-maps{display:grid;grid-template-columns:1fr 1fr;gap:12px}.twin-map{min-width:0;border:1px solid currentColor;padding:10px}.twin-map svg{width:100%;max-height:150px}.twin-tabs{display:none}@media(max-width:650px){.twin-tabs{display:flex;gap:8px}.twin-maps{display:block}.twin-map:not(.shown){display:none}}</style>';
  modal('Сравнение миров',style+branchReport(x,index,mobileRole)+'<div class="dialog-actions">'+
    (branchPreview?branchBtn('commit','Сохранить обе ветви · '+branchMiB(branchPreview.bytes))+' '+branchBtn('discard','Отменить'):
      branchBtn('peer','Открыть соседнюю ветвь')+' '+(x.report.site?branchBtn('map','Место на глобусе')+' ':'')+branchBtn('parent','Исходный мир'))+'</div>',true);
  $('#twin-year').onchange=event=>branchComparison(x,Number(event.target.value),mobileRole);

    event.stopPropagation();branchComparison(x,index,i);

}
function branchSnapshotAt(source,year){
  if(source.year<=year)return {world:source,index:null,year:source.year};
  let index=-1;for(let i=0;i<source.snapshots.length;i++)if(source.snapshots[i].year<=year)index=i;else break;
  return index<0?null:{world:Core.viewSnapshot(source,index),index,year:source.snapshots[index].year};
}
async function branchSource(side){
  if(branchPreview)return branchPreview.pair[side];
  const x=world.observatory?.experiment;if(!x)throw new Error('Отчёт сравнения недоступен.');
  const role=side?'experimental':'control';if(x.role===role)return world;
  const record=await store.get(x.peerId);if(!record?.world)throw new Error('Соседняя ветвь отсутствует на устройстве. Сначала откройте её из каталога.');return record.world;
}
async function branchInspect(side,index,site){
  const source=await branchSource(side),report=source.observatory.experiment.report,row=report.samples[index];
  if(!row||!site||!source.regions.some(r=>r.id===site))throw new Error('Место или год в отчёте недоступны.');
  const point=branchSnapshotAt(source,row[0]);if(!point)throw new Error('Для выбранного года нет более раннего полного среза.');
  const r=point.world.regions.find(r=>r.id===site);if(!r)throw new Error('Регион отсутствует в доступном срезе.');
  const role=side?'Опыт':'Контроль';
  modal('Регион · '+r.settlement.name,'<p>'+role+' · выбран год '+row[0]+'. '+(point.year===row[0]?'Открыт точный срез.':'Ближайший доступный ранний срез: '+point.year+' год.')+'</p><p>Регион '+h(site)+' · жители '+branchNumber(r.population)+' · пища '+branchNumber(r.economy.stock.food)+' · владелец '+h(point.world.societies.find(s=>s.id===r.owner)?.name??r.owner)+'.</p>'+
    '<div class="dialog-actions"><button data-branches="report" data-sample="'+index+'" data-side="'+side+'">К сравнению</button>'+(!branchPreview?'<button data-branches="focus" data-sample="'+index+'" data-side="'+side+'" data-site="'+h(site)+'">На глобус этой ветви</button>':'<p>Для перехода на глобус сначала сохраните пару.</p>')+'</div>',true);
}

    '<div class="form-row"><label for="twin-end">Сравнить до года</label><input id="twin-end" type="number" min="'+(world.year+1)+'" max="'+cap+'" value="'+end+'"></div>'+
    '<p>Две копии текущего состояния занимают около '+branchMiB(branchSize(world)*2)+'. После расчёта будет известен размер готовой пары.</p>'+
    (store.persistent?'':'<p>Хранилище браузера недоступно. Пара будет доступна в этом сеансе, каждую ветвь можно экспортировать.</p>')+

  $('#twin-edge').onchange=event=>{$('#twin-mode').innerHTML=branchModeOptions(world,event.target.value);};

async function branchCompute(parent,options,onProgress,job){
  const fallback=()=>Branches.comparePair(parent,options,Core,async(y,end)=>{
    if(job.cancelled)throw new Error('Сравнение отменено.');onProgress(y,end);
  });
  if(typeof Worker!=='function')return fallback();
  let engine;
  try{
    const base=JSON.parse($('#worker-source').textContent);
    const code=base+'\nself.onmessage=async({data})=>{try {const pair=await Branches.comparePair(data.world,data.options,Core,(year,end)=>self.postMessage({year,end}));self.postMessage({pair});}catch(e){self.postMessage({failure:e.message});}};';
    const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
    try{engine=new Worker(url);}finally{URL.revokeObjectURL(url);}
  }catch{return fallback();}
  try{
    return await new Promise((resolve,reject)=>{
      job.cancel=()=>{job.cancelled=true;reject(new Error('Сравнение отменено.'));};
      engine.onerror=()=>reject(new Error('Расчёт пары прерван. Исходный мир доступен.'));
      engine.onmessage=({data})=>{
        if(data.failure)reject(new Error(data.failure));
        else if(data.pair)resolve(data.pair);
        else if(data.year!==undefined)onProgress(data.year,data.end);
      };
      engine.postMessage({world:parent,options});
    });
  }finally{engine.terminate();job.cancel=null;}
}
async function branchesClick(button) {
  const action=button.dataset.branches;
  if(!action)return false;
  try{
    if(action==='open'){branchesDialog();return true;}
    if(action==='inspect'){
      await branchInspect(Number(button.dataset.side),Number(button.dataset.sample),button.dataset.site);return true;
    }
    if(action==='report'){
      const side=Number(button.dataset.side),source=await branchSource(side),x=source.observatory.experiment;
      branchComparison(x,Number(button.dataset.sample),side);return true;
    }
    if(action==='focus'){
      const side=Number(button.dataset.side),index=Number(button.dataset.sample),site=button.dataset.site;
      const source=await branchSource(side),row=source.observatory.experiment.report.samples[index],point=row&&branchSnapshotAt(source,row[0]);
      if(!point||!source.regions.some(r=>r.id===site))throw new Error('Место или срез больше недоступны.');
      if(source.id!==world.id)await transition(()=>openLocal(source.id));
      snapshotIndex=point.index;resetEconomyPages();showRegionMap(site);
      notice(point.year===row[0]?'Открыт регион в выбранном году '+row[0]+'.':'Выбран год '+row[0]+'; открыт ближайший ранний срез '+point.year+'.');return true;
    }
    if(action==='discard'){
      if(branchJob){branchJob.cancelled=true;branchJob.cancel?.();}
      branchPreview=null;$('#dialog').close();return true;
    }
    if(action==='run'){
      if(branchJob||busy||switching||localConflict||snapshotIndex!==null)return true;
      const parent=world,mode=$('#twin-mode').value,horizon=Number($('#twin-end').value);
      const observedEdge=$('#twin-edge').value;
      const condition=mode==='none'?null:{edge:observedEdge,mode,until:Number($('#twin-until').value)};
      const job={cancelled:false};branchJob=job;
      try{
        const from=await persist();
        if(parent!==world||!from)throw new Error('Выбранный мир изменился.');
        modal('Сравнение миров','<p id="twin-progress" role="status">Подготовка полных точек…</p>'+branchBtn('discard','Отменить'));
        const close=()=>{job.cancelled=true;job.cancel?.();};
        $('#dialog').addEventListener('close',close,{once:true});
        let pair;
        try{pair=await branchCompute(parent,{condition,horizon,observedEdge,parentRevision:from.revision},(y,end)=>{
          const node=$('#twin-progress');if(node)node.textContent='Рассчитан год '+y+' из '+end+'.';
        },job);}finally{$('#dialog').removeEventListener('close',close);}
        if(job.cancelled||world!==parent)return true;
        branchPreview={pair,parentId:parent.id,revision:from.revision,bytes:pair.reduce((n,w)=>n+branchSize(w),0)};
        branchComparison(pair[0].observatory.experiment);
        $('#dialog').addEventListener('close',()=>{branchPreview=null;},{once:true});
      }finally{branchJob=null;}
      return true;
    }
    if(action==='commit'&&branchPreview){
      const preview=branchPreview;
      await transition(async()=>{
        if(world.id!==preview.parentId||revision!==preview.revision)throw new Error('Исходная ревизия изменилась. Повторите сравнение.');
        const [a]=await store.commitBranchPair(preview.parentId,preview.revision,preview.pair);
        const record=await store.get(a.id);
        selectRecord(record);scheduleSync();
      });
      branchPreview=null;branchComparison(world.observatory.experiment);return true;
    }
    const x=world.observatory?.experiment;
    if(x&&(action==='peer'||action==='parent')){
      const id=action==='peer'?x.peerId:x.parentId;
      await transition(()=>openLocal(id));
      if(action==='peer'&&world.observatory?.experiment?.report)branchComparison(world.observatory.experiment);
    }else if(action==='map'&&x?.report?.site){showRegionMap(x.report.site);}
  }catch(error){if(!branchJob?.cancelled)notice(error.message,error.name==='ConflictError');}
  return true;
}

/* Field guide for the selected snapshot and reproducible, isolated gallery calculations. */
const FieldGuide = (() => {
  const demos = Object.freeze({
    doron: {name:'Дорон и мирное соглашение', seed:'АРХИВ-09', era:'agriculture', model:'0.8', horizon:90},
    basin: {name:'Строительство на реке', seed:'BASIN-1', era:'industrial', model:'1.0', horizon:120},
    voyage: {name:'Колонисты на обратном пути', seed:'ГОРИЗОНТ-12', era:'space', model:'1.0', horizon:220},
    investigation: {name:'Три свидетельства о переправе', seed:'МЕАНДР-19', era:'industrial', model:'1.0.1', horizon:100},
  });
  const eras={agriculture:'ранняя эпоха',industrial:'промышленная эпоха',space:'космическая эпоха'};
  const number=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n);
  const place=(w,id)=>w.regions.find(r=>r.id===id);
  const name=(w,id)=>place(w,id)?.settlement?.name??id;
  const soc=(w,id)=>w.societies.find(s=>s.id===id)?.name??id;
  const anchor=(w,type,id,site=null)=>({schema:w.schema,worldId:w.id,year:w.year,type,id,site});
  function recentEvent(w,engine){
    const since=Math.max(0,w.year-9);
    for(let page=engine.eventPageCount(w,w.year)-1;page>=0;page--){
      const events=engine.eventPage(w,page,{throughYear:w.year});
      for(let i=events.length-1;i>=0;i--){
        const e=events[i];
        if(e.year<since)return null;
        if(e.important&&e.type!=='origin')return e;
      }
    }
    return null;
  }
  function suggestions(w,engine){
    if(!w)return [];
    const out=[],since=Math.max(0,w.year-9);
    const fact=LivingWorld.summary(w,w.year).facts.filter(f=>f.year>=since&&f.year<=w.year&&place(w,f.site)).at(-1);
    if(fact)out.push({title:fact.title,description:name(w,fact.site)+' · запись года '+fact.year,source:'История места',target:anchor(w,'fact',fact.id,fact.site)});
    const ret=w.observatory?.space?.returns.filter(r=>Number.isInteger(r.arrival)&&r.arrival>=since&&r.arrival<=w.year&&place(w,r.region)).at(-1);
    if(ret)out.push({title:'Прибытие с колонии',description:name(w,ret.region)+' · год '+ret.arrival,source:'Журнал рейса',target:anchor(w,'voyage',ret.mission,ret.region)});
    const e=recentEvent(w,engine);
    if(e)out.push({title:e.title,description:'Год '+e.year+(e.regionIds?.length?' · '+name(w,e.regionIds[0]):''),source:'Хроника',target:anchor(w,'event',e.id,e.regionIds?.[0]??null)});
    if(out.length<3){
      const r=w.regions.reduce((best,r)=>!best||r.population>best.population?r:best,null);
      if(r)out.push({title:name(w,r.id),description:'Жителей региона в году '+w.year+': '+number(r.population)+'.',source:out.length?'Паспорт региона':'Спокойное наблюдение',target:anchor(w,'region',r.id,r.id),quiet:!out.length});
    }
    return out;
  }
  function yearIndex(live,target){
    if(!live||live.id!==target.worldId||live.schema!==target.schema)return undefined;
    if(live.year===target.year)return null;
    const index=live.snapshots.findIndex(s=>s.year===target.year);
    return index>=0?index:undefined;
  }
  function markers(key,w,engine){
    if(key==='investigation'){
      return LivingWorld.summary(w,w.year).traces.filter(t=>t.discovered!==null)
        .map(t=>({year:t.discovered,site:t.site,title:t.kind,detail:'След датирован '+t.formed+' годом. Идентифицирован в '+t.discovered+' году.'}))
        .sort((a,b)=>a.year-b.year);
    }
    if(key==='doron'){
      const r=w.regions.find(r=>r.settlement?.name==='Дорон');if(!r)return [];
      const events=engine.allEvents(w).filter(e=>e.regionIds?.includes(r.id));
      const occupation=events.find(e=>e.title==='Оккупация региона');
      const treaty=occupation&&events.find(e=>e.year>=occupation.year&&e.title==='Мирное соглашение');
      return [occupation,treaty].filter(Boolean).map(e=>({year:e.year,site:r.id,title:e.title,detail:e.detail}));
    }
    if(key==='basin'){
      const facts=LivingWorld.summary(w,w.year).facts,foundation=facts.find(f=>f.kind==='foundation');
      const done=foundation&&facts.find(f=>f.kind==='completed'&&f.site===foundation.site&&f.year>=foundation.year);
      return [foundation,done].filter(Boolean).map(f=>({year:f.year,site:f.site,title:f.title,detail:'Владелец в момент записи: '+soc(w,f.owner)+'.'}));
    }
    const records=w.observatory?.space?.returns??[];
    const flight=records.filter(r=>Number.isInteger(r.arrival)&&r.arrival<=w.year).sort((a,b)=>a.arrival-b.arrival)[0]??records[0];
    if(!flight)return [];
    const mission=engine.allMissions(w).find(m=>m.id===flight.mission);if(!mission)return [];
    const colony=w.colonies.find(c=>c.id===flight.origin);
    const aboard='Экипаж: '+number(mission.people)+'. Продовольствие: '+number(mission.cargo)+'.';
    const list=[{year:flight.year,colony:flight.origin,body:colony?.planet,title:'Вылет с колонии',detail:(colony?.name??flight.origin)+'. Пункт назначения: '+name(w,flight.region)+'. '+aboard}];
    if(Number.isInteger(flight.arrival)&&flight.arrival<=w.year)list.push({year:flight.arrival,site:flight.region,title:'Прибытие в родной регион',detail:name(w,flight.region)+'. Получатель: '+soc(w,flight.recipient)+'. '+aboard});
    return list;
  }
  async function replay(key,engine,frame,exactYear=null){
    const spec=demos[key];if(!spec)throw new Error('Неизвестный пример.');
    const limit=exactYear===null?spec.horizon:exactYear;
    if(!Number.isInteger(limit)||limit<0||limit>spec.horizon)throw new Error('Недоступный год примера.');
    const w=engine.createWorld(spec.seed,{era:spec.era}),session=engine.createWorkerSession(w);
    // A private worker session owns only the newly generated world. No user archive or store is opened.
    while(w.year<limit){
      await frame(w.year,limit);
      session.step(Math.min(5,limit-w.year));
      if(exactYear===null){
        const points=markers(key,w,engine);
        if(points.length>=(key==='investigation'?3:2)){
          const end=points.at(-1).year;
          if(w.year!==end)return replay(key,engine,frame,end);
          return {w,points};
        }
      }
    }
    return {w,points:markers(key,w,engine)};
  }
  return {demos,eras,suggestions,yearIndex,markers,replay,name,number};
})();

function openGuideTip(tip){
  if(!tip)return;
  const index=FieldGuide.yearIndex(world,tip.target);
  if(index===undefined){notice('Исходный год отсутствует среди доступных срезов. Обновите подсказки.');return;}
  setRunning(false);snapshotIndex=index;resetEconomyPages();render();
  const w=displayed(),target=tip.target;
  if(target.type==='event'){showEvent(target.id);return;}
  if(target.type==='region'){showRegionMap(target.site);return;}

    }else if(action==='download'&&guidePreview?.key==='doron'){
      const w=LegacyCore.clone(guidePreview.w);w.id=uniqueId();
      const codec=Storage.createSaveCodec(LegacyCore.SCHEMA,LegacyCore.MODEL_VERSION,LegacyCore.validateWorld);
      const text=await codec.encode(w),url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');

const PlaceFocus = (() => {
  let host, controls, observer, canvas, selected, selectedYear, sourceOpen = false;
  let historyLimit = 5, compareYear = null, sceneKey = '', lastScene = null;
  let previousFocus;
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const state = () => controls?.get?.() || {};
  const liveYear = s => Number.isFinite(s.liveYear) ? s.liveYear : s.world?.year;
  function availableYears(s) {
    const end = liveYear(s);
    return [...new Set((Array.isArray(s.timeline) ? s.timeline : [])
      .map(item => typeof item === 'number' ? item : item?.year)
      .filter(year => Number.isFinite(year) && year <= end)
      .concat(Number.isFinite(s.world?.year) ? [s.world.year] : []))].sort((a,b) => a-b);
  }
  function visibleRecords(s) {
    return (Array.isArray(s.records) ? s.records : [])
      .filter(record => Number.isFinite(record.year) && record.year <= s.world?.year)
      .sort((a,b) => b.year-a.year);
  }
  function projectRecord(s, records) {
    if (!s.project) return null;
    const id = s.project.id;
    const kinds=['foundation','payment','purpose','completed','ownership','dismantled'];
    return records.find(r => r.regionId===s.project.site && r.year>=s.project.started && kinds.includes(r.kind))
      || records.find(r => id!=null && r.sourceId===id) || null;
  }
  function sceneCaption(s) {
    const pop = new Intl.NumberFormat('ru-RU').format(s.region.population);
    const project = s.project;
    if (!project) return 'Жители региона · '+pop;
    const purpose = {passage:'переправа',irrigation:'водоснабжение хозяйств'}[project.purpose];
    const state = {building:'Строится',paused:'Работы приостановлены',completed:'Завершено',dismantled:'Разобрано'}[project.status];
    return [state,purpose].filter(Boolean).join(' · ') || 'Работы на реке';
  }
  function drawScene() {
    if (!host || !canvas || !lastScene || typeof PlaceLandscape === 'undefined') return;
    const {world, region, project, basin} = lastScene;
    if (world && region) PlaceLandscape.draw(canvas, world, region, {project, basin, year:world.year});
  }
  function ensureScene(s) {
    const region = s.region, world = s.world;
    const key = JSON.stringify([world?.seed, world?.year, region?.id, s.project, s.basin]);
    lastScene = {world, region, project:s.project, basin:s.basin};
    if (key !== sceneKey) {sceneKey = key; drawScene();}
  }
  function recordMarkup(record, s) {
    if (!record) return '<p>К этому году записей о месте нет.</p>';
    const related=(record.relatedIds||[]).map(id=>s.records.find(item=>item.id===id&&item.year<=s.world.year)).filter(Boolean);
    const links=related.map(item=>'<button type="button" data-pf="record" data-id="'+escapeHtml(item.id)+'">'+escapeHtml(item.year)+' · '+escapeHtml(item.title)+'</button>').join('');
    const source = sourceOpen
      ? '<div class="pf-source"><b>Источник</b><p>'+escapeHtml(record.source || 'Не указан')+' · '+escapeHtml(record.sourceId||record.id)+'</p>'+(record.detail ? '<p>'+escapeHtml(record.detail)+'</p>' : '') +links+'<button type="button" data-pf="source">← К записи</button></div>'
      : '<p>'+escapeHtml(record.text || 'Описание не записано.')+'</p><button type="button" data-pf="source">Источник →</button>';
    const jump = availableYears(s).includes(record.year) && record.year !== s.world?.year
      ? '<button type="button" data-pf="record-year">Показать год записи '+escapeHtml(record.year)+'</button>' : '';
    return '<article class="pf-record"><span class="pf-overline">ЗАПИСЬ · '+escapeHtml(record.year)+'</span><h3>'+escapeHtml(record.title || 'Запись')+'</h3>'+source+jump+'</article>';
  }
  function markup(s, records, record) {
    const world = s.world || {}, year = world.year, live = liveYear(s), dates = availableYears(s);
    if (!dates.includes(compareYear)) compareYear = dates.filter(y => y < year).at(-1) ?? year;
    const options = dates.map(y => '<option value="'+y+'"'+(y===compareYear?' selected':'')+'>'+y+(y===live?' · настоящее':'')+'</option>').join('');
    const list = records.slice(0, historyLimit).map(r => '<li><button type="button" data-pf="record" data-id="'+escapeHtml(r.id)+'" aria-pressed="'+(r === record)+'"><time>'+escapeHtml(r.year)+'</time> '+escapeHtml(r.title || 'Запись')+'</button></li>').join('');
    const more = records.length > historyLimit ? '<button type="button" data-pf="more">Показать ещё записи ('+(records.length-historyLimit)+')</button>' : '';
    const label = s.label || s.region?.settlement?.name || s.region?.name || s.region?.id || 'Выбранное место';
    const projectButton = projectRecord(s, records) ? '<button type="button" class="pf-project" data-pf="project">Сооружение →</button>' : '';
    return '<section class="place-focus" aria-label="Наблюдение за местом">'+
      '<header class="pf-header"><button type="button" data-pf="close">← '+(s.demo?'К обсерватории':'К планете')+'</button><div class="pf-heading"><span>'+escapeHtml(world.seed || 'Мир')+'</span><h2>'+escapeHtml(label)+'</h2></div><div class="pf-year">Год <strong>'+escapeHtml(year ?? '—')+'</strong><small>'+(year === live ? 'Настоящее' : 'Исторический срез · настоящее '+escapeHtml(live))+'</small></div></header>'+
      '<div class="pf-main"><div class="pf-scene"><div class="pf-canvas-slot"></div><p class="pf-scene-data">'+escapeHtml(sceneCaption(s))+'</p><p class="pf-scene-label">Реконструкция места · детали условны</p>'+projectButton+'</div>'+
      '<aside class="pf-card"><div class="pf-actions"><button type="button" data-pf="pin" aria-pressed="'+!!s.pinned+'">'+(s.pinned?'Открепить':'Закрепить')+'</button><button type="button" data-pf="next"'+(s.busy?' disabled':'')+'>Следующее изменение →</button></div>'+
      (s.message?'<p class="pf-message" role="status">'+escapeHtml(s.message)+'</p>':'')+recordMarkup(record, s)+
      '<div class="pf-date"><label>Сравнить с годом <select data-pf="compare-year">'+options+'</select></label><button type="button" data-pf="goto-year"'+(compareYear===year || s.busy?' disabled':'')+'>Показать '+escapeHtml(compareYear)+'</button></div>'+
      '<div class="pf-archive"><h4>История до '+escapeHtml(year ?? '—')+' года</h4><ol>'+list+'</ol>'+more+'</div></aside></div></section>';
  }
  function render() {
    if (!host) return;
    const s = state(), year = s.world?.year;
    if (year !== selectedYear) {selected = null; selectedYear = year; sourceOpen = false; historyLimit = 5;}
    const records = visibleRecords(s);
    const record = records.find(r => String(r.id) === String(selected)) || records[0] || null;
    selected = record?.id ?? null;
    const active = document.activeElement;
    const focus = host.contains(active) ? {action:active.dataset.pf, id:active.dataset.id} : null;
    host.innerHTML = markup(s, records, record);
    host.querySelector('.pf-canvas-slot').appendChild(canvas);
    ensureScene(s);
    if (focus) {
      const target = [...host.querySelectorAll('[data-pf]')].find(el => el.dataset.pf === focus.action && el.dataset.id === focus.id && !el.disabled);
      target?.focus({preventScroll:true});
    }
  }
  function click(event) {
    const button = event.target.closest('[data-pf]');
    if (!button || !host?.contains(button) || button.tagName === 'SELECT') return;
    const action = button.dataset.pf, s = state();
    if (action === 'record') {selected = button.dataset.id; sourceOpen = false; render();}
    else if (action === 'project') {const record = projectRecord(s, visibleRecords(s)); if (record) {selected = record.id; sourceOpen = false; render(); host.querySelector('.pf-record')?.scrollIntoView({block:'nearest'});}}
    else if (action === 'source') {sourceOpen = !sourceOpen; render();}
    else if (action === 'more') {historyLimit += 20; render();}
    else if (action === 'record-year') {const record = visibleRecords(s).find(r => String(r.id) === String(selected)); if (record && availableYears(s).includes(record.year)) controls.onAction('year', record.year);}
    else if (action === 'goto-year' && availableYears(s).includes(compareYear)) {
      const targetYear = compareYear;
      compareYear = s.world.year;
      controls.onAction('year',targetYear);
    }
    else if (['close','next','pin'].includes(action)) controls.onAction(action);
  }
  function change(event) {
    if (event.target.dataset.pf !== 'compare-year') return;

    if (availableYears(state()).includes(year)) {compareYear = year; render();}
  }
  function open(node, api) {
    if (host) close();
    host = node; controls = api; selected = null; selectedYear = undefined; sourceOpen = false; historyLimit = 5; compareYear = null; sceneKey = ''; previousFocus = document.activeElement;
    canvas = document.createElement('canvas'); canvas.setAttribute('aria-label','Реконструкция выбранного места');
    host.addEventListener('click', click); host.addEventListener('change', change); render();

  }
  return {open, refresh:render, close};
})();

// The codes and dates select two gallery visits. Rendering and records use the same
// engine as a visit to any player's own region. Gallery worlds stay in memory.
const PlaceVisit = (() => {
  const examples = {
    meander: {seed:'МЕАНДР-19', year:16},
    basin: {seed:'BASIN-6', year:30}
  };
  let visit = null;
  let returnAddress = null;
  function isDemoLink(){return Object.hasOwn(examples,new URLSearchParams(location.search).get('place')||'');}
  function setAddress(path){try{history.replaceState(null,'',path);}catch{/* Local file previews may disallow rewriting the path. */}}
  let sequence = 0;
  const dialog = () => document.getElementById('place-dialog');
  const pinKey = state => 'microgalaxy:v1:place:'+state.id;
  const sampleButtons = '<button data-place-sample="meander">МЕАНДР-19</button><button data-place-sample="basin">BASIN-6</button>';
  function entry() {
    return '<div class="place-entries"><span>Два мира крупным планом</span>'+sampleButtons+'</div>';
  }
  function waitTask(input) {
    if (!workerReady) {
      // This fallback does not give the simulation ownership of a saved world.
      return PlaceTime.perform(Core, PlaceRecords.placeRecords, input.world ? {...input,world:Core.clone(input.world)} : input, yieldFrame);
    }
    return new Promise((resolve,reject) => {
      const id = ++serial;
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error('Расчёт места занял слишком много времени. Повторите наблюдение.'));
      }, 90000);
      pending.set(id, {resolve,reject,timer});
      try { worker.postMessage({type:'place', id, input}); }
      catch (error) { clearTimeout(timer); pending.delete(id); reject(error); }
    });
  }
  function viewData() {
    const {shown,latest,id,demo,working,message} = visit;
    const region = shown.regions.find(item => item.id === id);
    const river = shown.observatory?.living?.basin;
    const basin = river && [river.upper,river.lower,river.alternate].includes(id) ? river : null;
    const project = basin?.project?.site === id ? basin.project : null;
    return {world:shown, region, label:PlaceRecords.placeName(shown,id), records:visit.records,
      timeline:visit.timeline, project, basin, liveYear:latest.year, demo, pinned:pref(pinKey(latest))===id,
      busy:working, message};
  }
  function updateState(latest,shown) {
    visit.latest = latest;
    visit.shown = shown;
    visit.records = PlaceRecords.placeRecords(shown,visit.id);
    const available = shown === latest ? visit.records : PlaceRecords.placeRecords(latest,visit.id);
    visit.recordYears = [...new Set(available.map(item=>item.year))].sort((a,b)=>a-b);
    const beforeChanges=visit.recordYears.filter(year=>year>0).map(year=>year-1);
    visit.timeline = [...new Set([0,latest.year,shown.year,...visit.recordYears,...beforeChanges,...latest.snapshots.map(s=>s.year)])]
      .filter(year=>PlaceTime.canVisit(latest,year)).sort((a,b)=>a-b);
  }
  function close() {
    sequence++;
    if (visit) PlaceFocus.close();
    visit = null;
    if (dialog().open) dialog().close();
    if(returnAddress!==null){
      setAddress(returnAddress);
      returnAddress=null;
      startObservatory();
    }
  }
  function start(latest,shown,id,demo) {
    visit = {latest,shown,id,demo,working:false,message:''};
    updateState(latest,shown);
    const host = dialog();
    if (!host.open) host.showModal();
    PlaceFocus.open(host,{get:viewData,onAction:action});
  }
  async function sample(key) {
    if (!Object.hasOwn(examples,key)) return;
    close();
    const current=new URL(location.href);
    returnAddress=isDemoLink()?current.pathname:current.pathname+current.search+current.hash;
    setAddress(current.pathname+'?place='+encodeURIComponent(key));
    const ticket=++sequence;
    setRunning(false);
    const host=dialog();
    host.innerHTML='<div class="place-loading" role="status">Открывается мир '+h(examples[key].seed)+'… <button data-place-dismiss>Закрыть</button></div>';
    host.showModal();
    try {
      await prepareWorker();
      if(ticket!==sequence)return;
      const {world:latest}=await waitTask({task:'example',...examples[key]});
      if (ticket!==sequence) return;
      start(latest,latest,PlaceRecords.placeSubject(latest,pref(pinKey(latest))),true);
    } catch(error) {
      if(ticket===sequence){close();notice(error.message);}
    }
  }
  function open(id) {
    if (busy || switching) return;
    if (!world) {
      modal('Два мира крупным планом',entry(),true);
      return;
    }
    const shown=displayed();
    const target=PlaceRecords.placeSubject(shown,id||pref(pinKey(world))||selectedRegion);
    if(!target)return;
    setRunning(false);
    if($('#dialog').open) $('#dialog').close();
    close();
    start(world,shown,target,false);
  }
  async function seeYear(v,year) {
    if(!v.timeline.includes(year))return;
    const shown=year===v.latest.year ? v.latest : (await waitTask({task:'year',world:v.latest,year})).world;
    if(visit===v) updateState(v.latest,shown);
  }
  async function advanceVisit(v) {
    const year=v.shown.year;
    const archived=v.recordYears.find(date=>date>year && PlaceTime.canVisit(v.latest,date));
    if(archived!==undefined){await seeYear(v,archived);return;}
    if(year<v.latest.year){
      await seeYear(v,v.latest.year);

// Opt-in measurements of normal website actions. Runs independently of the synthetic Worker benchmark.
const DeviceSession=(()=>{
  const key='microgalaxy-device-session/2/'+Core.MODEL_VERSION;
  let memory={visits:[],enabled:false},visit=null,selection=null,currentOpen=null,pageFrame=null,pointer=null;
  const now=()=>performance.now(), ms=n=>Math.round(n*10)/10;
  function read(){try{const v=JSON.parse(localStorage.getItem(key));if(v?.format===2&&Array.isArray(v.visits))return v;}catch{}return memory;}
  function put(data){memory=data;try{localStorage.setItem(key,JSON.stringify(data));}catch{}}
  function flush(){
    if(!visit)return;
    const data=read();if(!data.enabled)return;
    data.visits=data.visits.filter(v=>v.id!==visit.id).concat(visit).slice(-12);put(data);
  }
  function event(kind,details={}){
    if(!visit)return;
    visit.events.push({kind,atMs:ms(now()),...details});if(visit.events.length>400)visit.events.shift();
    flush();
  }
  function openVisit(mode){
    const nav=performance.getEntriesByType('navigation')[0];
    visit={id:crypto.randomUUID(),date:new Date().toISOString(),mode,device:read().device||null,pauseTargetMs:read().pauseTargetMs??null,
      browser:navigator.userAgent,viewport:[innerWidth,innerHeight],navigationType:nav?.type??null,
      model:Core.MODEL_VERSION,events:[],pauses:[]};
    const previous=read().visits.at(-1);
    if(previous)visit.previousVisit=previous.id;
    visit.expected=read().resume??null;selection=null;currentOpen=null;pageFrame=null;flush();
  }
  function enable(device,target){
    const data=read();data.format=2;data.enabled=true;data.device=String(device||'').trim().slice(0,100)||null;
    const value=Number(target);data.pauseTargetMs=Number.isFinite(value)&&value>0?value:null;
    put(data);openVisit('начато на открытой странице');
  }
  function next(mode){
    if(!['cold','warm'].includes(mode))return;
    const data=read();if(!data.enabled)return;
    data.next=mode;put(data);
  }
  function finish(){flush();const data=read();data.enabled=false;data.next=null;put(data);visit=null;}
  function configured(){return !!read().enabled;}
  if(read().enabled){
    const data=read(),mode=data.next??'обычная навигация';data.next=null;put(data);openVisit(mode);
  }
  function worldInfo(w,rev){return w?{id:w.id,seed:w.seed,era:w.era,year:w.year,revision:rev??null}:{};}
  function readResult(source,w,duration){
    if(!visit||!w)return;
    event('snapshot-read',{source,ms:ms(duration),...worldInfo(w)});
  }
  function validation(w,start,ok){if(visit)event('full-validation',{ms:ms(now()-start),ok,...worldInfo(w)});}
  function selecting(w,rev){
    if(!visit)return;
    selection=w;currentOpen={...worldInfo(w,rev),selectedAt:now(),drawn:false,painted:false};pageFrame=null;
    event('world-selected',worldInfo(w,rev));
    if(visit.expected&&!visit.events.some(e=>e.kind==='reopened'))event('reopened',{expected:visit.expected,actual:worldInfo(w,rev),
      sameWorld:visit.expected.id===w.id,sameYear:visit.expected.year===w.year});
  }
  function firstFrame(){
    if(!visit||!currentOpen?.drawn||currentOpen.painted||pageFrame||document.hidden)return;
    const target=currentOpen,which=visit;
    pageFrame=requestAnimationFrame(()=>requestAnimationFrame(()=>{
      pageFrame=null;
      if(visit!==which||currentOpen!==target||!target.drawn||target.painted||document.hidden||switching||busy||
        !world||world.id!==target.id||view!=='planet'||document.querySelector('#visual')?.hidden||
        document.querySelector('#dialog')?.open||document.querySelector('#mobile-object')?.disabled)return;
      target.painted=true;event('globe-interactive',{...worldInfo(world,revision),navigationMs:ms(now()),afterSelectionMs:ms(now()-target.selectedAt)});
      const capture=selection;
      setTimeout(async()=>{
        if(visit!==which||selection!==capture)return;
        const {id,...content}=capture,text=JSON.stringify(capture),size=new TextEncoder().encode(text).length;
        const fingerprint=await Storage.digest(JSON.stringify(content));
        if(visit===which)event('snapshot-size',{...worldInfo(capture,target.revision),jsonBytes:size,contentSHA256:fingerprint});
      },0);
    }));
  }
  function bindRenderer(r){
    const original=r.update;
    r.update=function(w,mode,...args){
      if(!visit||w!==selection||mode!=='planet'||currentOpen?.drawn)return original.call(this,w,mode,...args);
      const start=now(),result=original.call(this,w,mode,...args);
      currentOpen.drawn=true;event('globe-prepare',{...worldInfo(w,currentOpen.revision),ms:ms(now()-start)});firstFrame();return result;
    };
    r.canvas.addEventListener('pointerdown',()=>{if(visit&&currentOpen?.painted&&view==='planet')pointer={angle:r.rotation,id:world?.id};});
    r.canvas.addEventListener('pointerup',()=>{if(pointer&&visit&&pointer.id===world?.id&&r.rotation!==pointer.angle)event('globe-rotated',worldInfo(world,revision));pointer=null;});
    r.canvas.addEventListener('pointercancel',()=>{pointer=null;});
  }
  function pause(press){
    if(!visit||!world)return;
    const selected=visit,info=worldInfo(world,revision),start=Number.isFinite(press)&&press>=0&&press<=now()?press:now();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(visit!==selected||document.hidden||running||world?.id!==info.id)return;
      visit.pauses.push({...info,ms:ms(now()-start),atMs:ms(now())});
      if(visit.pauses.length>150)visit.pauses.shift();flush();
    }));
  }
  function background(hidden,w,rev,wasRunning){
    if(!visit)return;
    event(hidden?'hidden':'visible',{...worldInfo(w,rev),wasRunning,paused:!running});
  }
  function savedBackground(w,rev,ok){
    if(!visit)return;event('background-save',{...worldInfo(w,rev),ok});
    if(ok&&w){const data=read();data.resume=worldInfo(w,rev);put(data);}
  }
  function pageHide(){
    if(!visit)return;const info=worldInfo(world,revision);
    event('pagehide',{...info,unsaved:localUnsaved,conflict:localConflict});
    if(world&&!localUnsaved&&!localConflict){const data=read();data.resume=info;put(data);}
  }
  window.addEventListener('pagehide',pageHide);
  function report(){
    const data=read(),groups=new Map();
    for(const v of data.visits)for(const p of v.pauses){
      const k=JSON.stringify([v.id,p.id]);if(!groups.has(k))groups.set(k,{visit:v.id,seed:p.seed,worldId:p.id,years:[],samples:[]});
      const g=groups.get(k);g.years.push(p.year);g.samples.push(p.ms);
    }
    const pauseSeries=[...groups.values()].map(g=>{const sorted=g.samples.slice().sort((a,b)=>a-b);return {...g,n:sorted.length,
      p95Ms:sorted.length>=20?sorted[Math.ceil(.95*sorted.length)-1]:null,minimumSamples:20};});
    return {format:'microgalaxy-device-session/2',model:Core.MODEL_VERSION,device:data.device??null,visits:data.visits,
      pauseSeries,units:'ms',pauseMethod:'Обычная кнопка паузы до второго requestAnimationFrame. P95 по ближайшему верхнему рангу, не менее 20 на одну историю и запуск.',
      launchMethod:'cold/warm выбирает наблюдатель. Тип навигации фиксируется браузером; состояние его кеша сайт не определяет.'};
  }
  return {enable,next,finish,configured,event,readResult,validation,selecting,bindRenderer,firstFrame,pause,background,savedBackground,report,
    get active(){return !!visit;}};
})();

// Serialized into its own Worker, so this function depends only on Core and browser globals.
function deviceWorker(){
  let paused=false;
  self.onmessage=async({data})=>{
    if(data.pause!==undefined){paused=data.pause;postMessage({paused});return;}
    try{
      const start=performance.now(),w=Core.createWorld(data.seed,{era:data.era}),s=Core.createWorkerSession(w);
      postMessage({create:performance.now()-start});
      let finalStep=null;
      for(const year of data.checks){
        while(w.year<year){
          if(paused){await new Promise(r=>setTimeout(r,20));continue;}
          if(year===10000&&w.year===9999){const t=performance.now();s.step(1);finalStep=performance.now()-t;}
          else s.step(Math.min(25,(year===10000?9999:year)-w.year));
          postMessage({progress:w.year});await new Promise(r=>setTimeout(r,0));
        }
        const t=performance.now();Core.validateWorld(w);const validation=performance.now()-t;
        const bytes=new TextEncoder().encode(JSON.stringify(w)).length;
        let annual=finalStep,stepFrom=9999;
        if(year<10000){const copy=Core.createWorkerSession(structuredClone(w));stepFrom=year;const t=performance.now();copy.step(1);annual=performance.now()-t;}
        const entries=Core.allEvents(w),recentEvents=entries.filter(e=>e.year>year-100).length;
        const shipments=Math.max(0,w.economy.nextShipment-1),movements=entries.filter(e=>e.movement).length;
        postMessage({sample:{year,validation,annual,stepFrom,bytes,recentEvents,shipments,movements}});
      }
      postMessage(data.keep?{done:true,world:w}:{done:true});
    }catch(e){postMessage({failure:e.message});}
  };
}

async function previewRetentionLimit(scope,limitBytes) {

    for(const row of page.worlds){if(!Object.hasOwn(catalogModels,row.model)||typeof row.id!=='string')continue;const safe={...row,key:row.model+':'+row.id};catalogCloudRows.set(safe.key,safe);if(row.model===activeModel)cloudRows.set(row.id,row);}
    catalogCursor=page.nextCursor??null;
    if(page.partial){
      const unavailable=(page.unavailableModels??[]).map(key=>catalogModels[key]?.label).filter(Boolean);
      if(unavailable.length)partialMessages.add('Недоступны версии '+unavailable.join(', ')+'.');
      if(page.skippedRows)partialMessages.add('Есть повреждённые сведения о мирах.');
      if(!partialMessages.size)partialMessages.add('Часть сведений недоступна.');
    }
    catalogState=partialMessages.size?'partial':'ready';
    catalogIssue=partialMessages.size?'Облачный каталог прочитан частично. '+[...partialMessages].join(' ')+' Повторите проверку кнопкой «Обновить каталог».':'';
    repaint();
  }).catch(error=>{
    if(request!==archiveRequest)return;
    catalogState=error.code==='unauthorized'?'unauthorized':'error';
    if(catalogState==='unauthorized'){catalogCloudRows.clear();cloudRows.clear();retentionState.cloud=null;}
    catalogIssue=error.message+(catalogCloudRows.size?' Показаны ранее полученные записи.':'');repaint();
  });
  await Promise.all([local,remote]);
  if(catalogStarted!==null&&request===archiveRequest&&$('#dialog').open&&$('#dialog-title').textContent==='Мои миры'){
    await devicePaint();
    if(request===archiveRequest&&$('#dialog').open&&$('#dialog-title').textContent==='Мои миры')DeviceSession.event('catalogue-displayed',{ms:Math.round((performance.now()-catalogStarted)*10)/10,
      local:catalogLocalRows.size,cloud:catalogCloudRows.size,cloudState:catalogState,localIssue:legacyLocalIssue||null,more});
  }

}
function about(){modal('MICROGALAXY · 1.1 «Ночная орбита»',(world?'<p>Правила этого мира · '+h(world.modelVersion)+'</p>':'')+'<p>Личная обсерватория одной звёздной системы: вы наблюдаете историю, а не управляете обществами.</p><h3>Ресурсы и пути</h3><p>Продовольствие, сырьё, энергия и оборудование учитываются в региональных запасах и отправлениях. Дороги и порты требуют строительства и содержания; грузы занимают время и могут теряться или ожидать открытия пути. Дефицит влияет на общества и миграцию.</p><p>Все величины условны: это игровая модель, а не научный прогноз. На глобусе слой маршрутов показывает переселения, а не грузопотоки. Полные сведения о грузах и балансе — на странице «Экономика и пути».</p><h3>Общества и знания</h3><p>Культура, доступность и представительство регионов меняются в ходе истории. Возможности зависят от предпосылок и могут быть утрачены и восстановлены. Их состояние и причины доступны в паспорте общества.</p><h3>История и сохранения</h3><p>Исторические срезы показывают сохранённое состояние, не каждый год. Старые миры открываются в собственных моделях через «Мои миры» и не преобразуются автоматически. Экспорт создаёт резервную копию; статус сообщает о локальном и облачном сохранении.</p>',true);}
